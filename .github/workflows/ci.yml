name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]

jobs:
  # Build the full tree and run ctest on each OS.
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.10.0"

      - name: Install GLFW system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Configure, build, test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./setup_build.sh build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
        shell: bash

      # MinGW gcc so find_package re-rooting works like the Unix path.
      - name: Configure, build, test (Windows)
        if: runner.os == 'Windows'
        run: |
          cat > win_profile.txt <<'EOF'
          [settings]
          os=Windows
          arch=x86_64
          compiler=gcc
          compiler.version=14
          compiler.libcxx=libstdc++11
          compiler.cppstd=17
          build_type=Release
          [buildenv]
          CC=gcc
          CXX=g++
          EOF
          conan install conan/conanfile.txt -of=build -pr:a win_profile.txt --build=missing
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
        shell: bash

  # Build the nanobind wheel. Windows excluded: the SKBUILD path shells
  # out to setup_build.sh (bash).
  wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.0
        env:
          # Conan comes from [build-system].requires.
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Build the core+engine Conan package from conan/all.
  conan-package:
    name: Build Conan package
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.10.0"

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            echo "PKG_VERSION=${version#v}" >> "$GITHUB_ENV"
          else
            echo "PKG_VERSION=0.0.0-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Conan create
        run: |
          conan profile detect --force
          conan create conan/all --version "$PKG_VERSION" \
            --build=missing -s compiler.cppstd=20

      - name: Export Conan package
        run: |
          conan cache save "piper/${PKG_VERSION}:*" \
            --file "piper-${PKG_VERSION}-linux-x86_64.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: conan-package
          path: piper-*.tgz
          if-no-files-found: error

  # Attach the wheels and the Conan package to a GitHub release. Tag pushes only.
  release:
    name: Release
    needs: [wheels, conan-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Download Conan package
        uses: actions/download-artifact@v4
        with:
          name: conan-package
          path: conan-package

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" wheelhouse/*.whl conan-package/*.tgz \
            --repo="$GITHUB_REPOSITORY" \
            --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
            --generate-notes
